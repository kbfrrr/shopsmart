name: shopsmart

x-api-image: &api-image
  image: shopsmart-api:${SHOPSMART_IMAGE_TAG:-local}
  build:
    context: ../..
    dockerfile: deployment/aws/Dockerfile
    target: api

x-database-environment: &database-environment
  DATABASE_URL: postgresql://shopsmart_user:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deployment/aws/.env}@postgres:5432/shopsmart?schema=public&connection_limit=5&connect_timeout=5&pool_timeout=5

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: shopsmart
      POSTGRES_USER: shopsmart_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deployment/aws/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    mem_limit: 512m
    cpus: 0.75
    stop_grace_period: 30s
    logging: *logging

  migrate:
    <<: *api-image
    restart: "no"
    environment:
      <<: *database-environment
    command: ["sh", "-c", "npm exec --workspace backend -- prisma migrate deploy && node backend/prisma/initialize-demo.js"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - database
    mem_limit: 512m
    logging: *logging

  api:
    <<: *api-image
    init: true
    restart: unless-stopped
    environment:
      <<: *database-environment
      NODE_ENV: production
      FRONTEND_URL: ${FRONTEND_URL:?Set FRONTEND_URL in deployment/aws/.env}
      TRUST_PROXY: "1"
      NODE_OPTIONS: --max-old-space-size=256
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - database
      - web
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/ready', {signal: AbortSignal.timeout(4000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    mem_limit: 512m
    cpus: 1
    stop_grace_period: 20s
    logging: *logging

  web:
    image: shopsmart-web:${SHOPSMART_IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: deployment/aws/Dockerfile
      target: web
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS in deployment/aws/.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks:
      - web
    mem_limit: 128m
    cpus: 0.5
    logging: *logging

networks:
  database:
    internal: true
  web:

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
