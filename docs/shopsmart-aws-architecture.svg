 <path d="M1050 558H1007V840H956" class="access" stroke-dasharray="7 4"/>

 <path d="M40 966H83" class="request" marker-start="url(#red)"/>
 <text x="95" y="971" class="body" font-weight="700">Web request and response</text>
 <path d="M420 966H463" class="access"/>
 <text x="475" y="971" class="body" font-weight="700">Data, persistence or administration</text>
 <path d="M900 966H943" class="release"/>
 <text x="955" y="971" class="body" font-weight="700">Release migration</text>
 <text x="38" y="1014" class="small">Hosted URL: https://shopsmart.13.251.6.115.sslip.io · HTTPS staging access restricted to the tester IP</text>
</svg>
